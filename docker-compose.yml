services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testcasegen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testcasegen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: ./django_auth_service
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,auth
      DB_NAME: testcasegen
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Auto-created on first boot so you can log in without a manual step
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-adminpassword123}
    volumes:
      - ./django_auth_service:/app
      - jwt_keys:/app/core/keys
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: ./fastapi_service
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/testcasegen
      # separate vars because the entrypoint's pg_isready needs them split out
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      REDIS_URL: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - ./fastapi_service:/app
      # read-only: this service verifies tokens but must never be able to sign them
      - jwt_keys:/app/keys:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      # Browser-side URLs, so these are localhost (not compose service names)
      VITE_AUTH_BASE_URL: http://localhost:8000
      VITE_API_BASE_URL: http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - auth
      - api

volumes:
  postgres_data:
  jwt_keys: